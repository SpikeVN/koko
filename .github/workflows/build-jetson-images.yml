name: Build Jetson support images

on:
  push:
    branches: [main]
    paths:
      - "koko/**"
      - "tools/phonemize_server.py"
      - "deploy/jetson/websocket.Dockerfile"
      - "deploy/jetson/phonemize.Dockerfile"
      - "deploy/jetson/requirements.websocket.txt"
      - "pyproject.toml"
      - ".github/workflows/build-jetson-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'koko/**'
              - 'deploy/jetson/websocket.Dockerfile'
              - 'deploy/jetson/requirements.websocket.txt'
              - 'pyproject.toml'
            phonemize:
              - 'tools/phonemize_server.py'
              - 'deploy/jetson/phonemize.Dockerfile'
      - id: matrix
        env:
          SERVER_CHANGED: ${{ steps.filter.outputs.server }}
          PHONEMIZE_CHANGED: ${{ steps.filter.outputs.phonemize }}
          BUILD_ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          matrix='[]'
          if [[ "$SERVER_CHANGED" == true || "$BUILD_ALL" == true ]]; then
            matrix=$(jq -c '. + [{"name":"server","dockerfile":"deploy/jetson/websocket.Dockerfile","image":"koko-server","base_arg":"BASE_IMAGE=dustynv/onnxruntime:r35.4.1"}]' <<< "$matrix")
          fi
          if [[ "$PHONEMIZE_CHANGED" == true || "$BUILD_ALL" == true ]]; then
            matrix=$(jq -c '. + [{"name":"phonemize","dockerfile":"deploy/jetson/phonemize.Dockerfile","image":"koko-phonemize","base_arg":""}]' <<< "$matrix")
          fi
          echo "matrix={\"include\":$matrix}" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=jp5
            type=raw,value=latest
            type=sha,prefix=jetpack5-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.base_arg }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
