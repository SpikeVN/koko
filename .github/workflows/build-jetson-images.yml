name: Build Jetson images

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: deploy/jetson/websocket.Dockerfile
            image: koko-server
            base_arg: BASE_IMAGE=dustynv/onnxruntime:r35.4.1
          - name: whisper
            dockerfile: deploy/jetson/whisper-live.Dockerfile
            image: koko-whisper
            base_arg: BASE_IMAGE=dustynv/whisperx:r35.3.1
          - name: phonemize
            dockerfile: deploy/jetson/phonemize.Dockerfile
            image: koko-phonemize
            base_arg: ""

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=jp5
            type=raw,value=latest
            type=sha,prefix=jetpack5-
      - name: Build and push ARM64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.base_arg }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
