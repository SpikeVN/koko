name: Build AMD64 CPU images

on:
  push:
    branches: [main]
    paths:
      - "koko/**"
      - "tools/phonemize_server.py"
      - "tts_model/voices_v3_turbo.json"
      - "tts_model/more_voices.json"
      - "deploy/amd64-cpu/**"
      - "deploy/amd64/phonemize.Dockerfile"
      - ".github/workflows/build-amd64-cpu-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            dockerfile: deploy/amd64-cpu/websocket.Dockerfile
            image: koko-server
          - name: whisper
            dockerfile: deploy/amd64-cpu/whisper-live.Dockerfile
            image: koko-whisper
          - name: phonemize
            dockerfile: deploy/amd64/phonemize.Dockerfile
            image: koko-phonemize
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=amd64-cpu
            type=sha,prefix=amd64-cpu-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64-cpu-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=amd64-cpu-${{ matrix.name }}
