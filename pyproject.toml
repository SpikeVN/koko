[project]
name = "koko"
version = "0.1.0"
description = "Cabin interpreter: speech -> LLM -> speech. Laptop-first: ASR+TTS local, LLM remote (Jetson llama-server). For py3.8 Jetson use requirements-jetson-py38.txt."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "onnxruntime-gpu>=1.30.0",
    "proc-tap>=1.1.1; sys_platform != 'win32'",
    "sea-g2p>=0.9.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "sv-ttk>=2.6.0",
    "tokenizers>=0.22,<0.24",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["koko*", "clients*"]

[project.scripts]
koko-client = "clients.client:main"
koko-server = "koko.server:main"
koko-whisper-server = "koko.whisper_live_server:main"

[dependency-groups]
jetson = []   # jetson/tooling-only; runtime deps pinned in requirements-jetson-py38.txt (py3.8)
